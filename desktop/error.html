<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pivora could not start</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #f3f6fb;
        color: #172033;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(circle at 10% 0%, #dfe7ff 0, transparent 38%),
          radial-gradient(circle at 95% 85%, #d9f5ef 0, transparent 35%),
          #f3f6fb;
      }
      main {
        width: min(620px, 100%);
        border: 1px solid rgba(91, 111, 160, 0.22);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.88);
        padding: 32px;
        box-shadow: 0 30px 90px rgba(30, 45, 82, 0.15);
        backdrop-filter: blur(18px);
      }
      .mark {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 15px;
        background: #4f6df5;
        color: white;
        font-weight: 800;
        box-shadow: 0 12px 30px rgba(79, 109, 245, 0.3);
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 28px;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        color: #61708f;
        line-height: 1.65;
      }
      code {
        display: block;
        margin-top: 18px;
        border-radius: 14px;
        background: #edf1f8;
        padding: 14px;
        color: #34415f;
        font:
          12px/1.55 'Cascadia Code',
          Consolas,
          monospace;
        overflow-wrap: anywhere;
      }
      button {
        margin-top: 22px;
        border: 0;
        border-radius: 12px;
        background: #4f6df5;
        padding: 11px 18px;
        color: white;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(79, 109, 245, 0.24);
      }
      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }
      #status {
        margin-left: 12px;
        color: #61708f;
        font-size: 13px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #101521;
          color: #ecf1ff;
        }
        body {
          background:
            radial-gradient(circle at 15% 0%, #1c2850, transparent 40%), #101521;
        }
        main {
          border-color: #303b54;
          background: rgba(24, 31, 47, 0.92);
        }
        p,
        #status {
          color: #9aa8c5;
        }
        code {
          background: #111827;
          color: #c5d0e8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">P</div>
      <h1>The local engine did not start</h1>
      <p>
        Pivora kept your reports untouched. Retry the private local runtime, or
        use the log path below when reporting the problem.
      </p>
      <code id="details">Loading diagnostics…</code>
      <div>
        <button id="retry" type="button">Retry local engine</button>
        <span id="status" role="status"></span>
      </div>
    </main>
    <script>
      const details = document.querySelector('#details');
      const retry = document.querySelector('#retry');
      const status = document.querySelector('#status');

      async function refreshStatus() {
        const value = await window.pivoraDesktop.runtimeStatus();
        details.textContent = `${value.message}\nLog: ${value.logPath}`;
      }

      retry.addEventListener('click', async () => {
        retry.disabled = true;
        status.textContent = 'Starting…';
        const result = await window.pivoraDesktop.retryRuntime();
        if (!result.ok) {
          status.textContent = 'Still unavailable';
          await refreshStatus();
          retry.disabled = false;
        }
      });

      void refreshStatus();
    </script>
  </body>
</html>
