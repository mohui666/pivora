name: Windows desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'desktop/**'
      - 'e2e/**'
      - 'hooks/**'
      - 'lib/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'electron-builder.yml'
      - '.github/workflows/desktop.yml'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: |
          npm test
          npm run lint
          npx tsc --noEmit

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium --only-shell

      - name: Run browser workflows
        run: npm run test:e2e

      - name: Build Windows desktop artifacts
        run: npm run desktop:dist

      - name: Smoke test packaged application
        run: npm run desktop:smoke

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pivora-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/Pivora-Setup-*.exe
            release/Pivora-Portable-*.exe
            release/desktop-smoke.json
